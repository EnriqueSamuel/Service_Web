<!DOCTYPE html>
<html lang="es">
<head>
  <title>Cotizar | Rutapak</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="d-flex justify-content-between align-items-center flex-wrap">
      <a href="index.html">
        <img src="img/caja.png" alt="Logo de Rutapak" width="32" height="32">
        Rutapak
      </a>
      <ul class="d-flex flex-wrap">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="rastreo.html">Rastreo</a></li>
        <li><a class="activo" href="cotizar.html">Cotizar</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>
 <main class="container">
    <section class="pagina">
      <h1>Cotiza tu envío</h1>
      <p>Llena los datos de tu paquete y te damos un precio aproximado.</p>

      <div class="row g-4">
        <div class="col-12 col-lg-7">
          <form id="cotizar" class="formulario ancho">
            <div class="row">
              <div class="campo col-12 col-md-6">
                <label for="origen">Ciudad de origen</label>
                <select id="origen" name="origen">
                  <option value="">Elige una ciudad</option>
                  <option>Tula de Allende</option>
                  <option>Pachuca</option>
                  <option>Ciudad de México</option>
                  <option>Querétaro</option>
                  <option>Puebla</option>
                  <option>Guadalajara</option>
                  <option>Monterrey</option>
                  <option>Mérida</option>
                </select>
                <small class="error"></small>
              </div>
              <div class="campo col-12 col-md-6">
                <label for="destino">Ciudad de destino</label>
                <select id="destino" name="destino">
                  <option value="">Elige una ciudad</option>
                  <option>Tula de Allende</option>
                  <option>Pachuca</option>
                  <option>Ciudad de México</option>
                  <option>Querétaro</option>
                  <option>Puebla</option>
                  <option>Guadalajara</option>
                  <option>Monterrey</option>
                  <option>Mérida</option>
                </select>
                <small class="error"></small>
              </div>
            </div>

            <div class="row">
              <div class="campo col-6 col-md-3">
                <label for="peso">Peso (kg)</label>
                <input id="peso" name="peso" type="number" step="0.1">
                <small class="error"></small>
              </div>
              <div class="campo col-6 col-md-3">
                <label for="largo">Largo (cm)</label>
                <input id="largo" name="largo" type="number">
                <small class="error"></small>
              </div>
              <div class="campo col-6 col-md-3">
                <label for="ancho">Ancho (cm)</label>
                <input id="ancho" name="ancho" type="number">
                <small class="error"></small>
              </div>
              <div class="campo col-6 col-md-3">
                <label for="alto">Alto (cm)</label>
                <input id="alto" name="alto" type="number">
                <small class="error"></small>
              </div>
            </div>

            <div class="campo check">
              <span>Servicio:</span>
              <input type="radio" id="economico" name="servicio" value="economico" checked>
              <label for="economico">Económico</label>
              <input type="radio" id="express" name="servicio" value="express">
              <label for="express">Exprés</label>
            </div>

            <div class="campo check">
              <input type="checkbox" id="seguro" name="seguro">
              <label for="seguro">Asegurar mi paquete (+$35)</label>
            </div>
            <p class="respuesta"></p>
            <button class="boton" type="submit">Calcular precio</button>
          </form>
        </div>

        <div class="col-12 col-lg-5">
          <aside class="tarjeta">
            <h2>Tu cotización</h2>
            <p id="total" class="total">$0.00</p>
            <p id="detalle">Llena el formulario para ver el precio.</p>
            <p id="historial"></p>
          </aside>
        </div>
      </div>
    </section>
  </main>
  
  <footer>
    <p>Rutapak &copy; 2026</p>
    <p>Proyecto escolar con datos ficticios</p>
  </footer>
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>
 
  <script src="script.js"></script>
</body>
</html>
